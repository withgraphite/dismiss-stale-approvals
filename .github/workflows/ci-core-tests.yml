name: core-tests

on:
  pull_request:
    types: [
        # Default pull_request trigger types.
        opened,
        synchronize,
        reopened,
      ]
  push:
    branches: [main]
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
       - name: Checkout
         uses: actions/checkout@v4

       - name: Validate syntax
         run: bash -n *.sh tests/*.sh

       - name: Test approval dismissal
         run: bash tests/test_dismiss_approvals.sh